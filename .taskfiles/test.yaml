version: "3"

tasks:
  default:
    desc: Run every test
    cmds:
      - task: rust
      - task: js

  rust:
    desc: Run the Rust tests of the whole workspace
    cmd: cargo test --workspace

  contract:stack:
    desc: Run the contract checks against a real Streamline with the player extension and the engine
    cmd: >-
      node dev/contract/stack-run.ts
      dev/contract/auth-flow-check.ts
      dev/contract/browse-check.ts
      dev/contract/pair-check.ts
      dev/contract/admin-check.ts
      dev/contract/activity-check.ts
      dev/contract/media-files-check.ts
      dev/contract/downloads-api-check.ts

  js:
    desc: Run the UI's rule and message checks
    cmds:
      - node dev/account-check.ts
      - node --import ./dev/controller-check/register.mjs dev/ask-check.ts
      - node dev/auto-check.ts
      - node dev/activity-view-check.ts
      - node --import ./dev/controller-check/register.mjs dev/activity-store-check.ts
      - node dev/approve-check.ts
      - node dev/auth-check.ts
      - node dev/browse-check.ts
      - node dev/detail-check.ts
      - node dev/form-factor-check.ts
      - node dev/downloads-view-check.ts
      - node --import ./dev/controller-check/register.mjs dev/downloads-store-check.ts
      - node dev/halt-check.ts
      - node dev/keyboard-check.ts
      - node dev/library-check.ts
      - node --import ./dev/controller-check/register.mjs dev/library-store-check.ts
      - node dev/reconcile-check.ts
      - node --import ./dev/controller-check/register.mjs dev/progressive-check.ts
      - node --import ./dev/controller-check/register.mjs dev/local-port-check.ts
      - node dev/playback-check.ts
      - node --import ./dev/controller-check/register.mjs dev/pairing-check.ts
      - node --import ./dev/controller-check/register.mjs dev/controller-check/check.mjs
      - node --import ./dev/controller-check/register.mjs dev/now-playing-check.ts
      - node --import ./dev/controller-check/register.mjs dev/player-view-check.ts
      - node dev/player-panels-check.ts
      - node dev/server-view-check.ts
      - node --import ./dev/controller-check/register.mjs dev/server-store-check.ts
      - node dev/shaka-caps-check.ts
      - node dev/trickplay-check.ts
      - node dev/messages-check.ts
      - node dev/shortcuts-check.ts
      - node dev/contract/proxy-check.ts
      - node dev/contract/auth-flow-check.ts
      - node dev/contract/browse-check.ts
      - node dev/contract/pair-check.ts
      - node dev/contract/activity-check.ts
      - node dev/contract/admin-check.ts
      - node dev/contract/media-files-check.ts
      - node dev/contract/downloads-api-check.ts
      - cmd: node dev/web-build-check.ts
        # Only a web build in build/ is checked; `task build:web` makes one and marks it. A native build lands in build/ too.
        if: test -f build/.web-target
