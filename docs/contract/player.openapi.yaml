# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2024-10-18
openapi: "3.0.4"
info:
  title: Streamline Player API
  version: 0.1.0
  description: |
    What the player's clients send and read, as the mock (dev/mock-streamline.py) serves it today.
    Served by the `player` Streamline extension under /extensions/player: /authorize on a session mount (Streamline signs the browser in), everything else on a self mount where the extension checks its own credentials.
    dev/contract/proxy.ts checks the mock and every client against this file.

servers:
  - url: /extensions/player

security:
  - deviceKey: []
  - bearer: []

paths:
  /home:
    get:
      operationId: getHome
      description: The Home screen. The billboard's featured titles with the reason each is shown, and the days of new arrivals below it.
      responses:
        "200":
          description: Both lists are empty for a library with nothing in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeFeed" }
        default: { $ref: "#/components/responses/Error" }
  /movies:
    get:
      operationId: listMovies
      description: The Movies library grid (Library screen) and Home's rows.
      responses:
        "200":
          description: Every movie, without media files or cast.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleList" }
        default: { $ref: "#/components/responses/Error" }
  /series:
    get:
      operationId: listSeries
      description: The Series library grid (Library screen) and Home's rows.
      responses:
        "200":
          description: Every series, without seasons or cast.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleList" }
        default: { $ref: "#/components/responses/Error" }
  /movies/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getMovie
      description: The movie Detail screen, and the player's source of media ids.
      responses:
        "200":
          description: One movie with its media files and cast.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        default: { $ref: "#/components/responses/Error" }
  /series/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSeries
      description: The series Detail screen with its seasons and episodes.
      responses:
        "200":
          description: One series with seasons, episodes and cast.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        default: { $ref: "#/components/responses/Error" }
  /people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPerson
      description: The Person screen, reached from a title's cast.
      responses:
        "200":
          description: A person's credits on this server and what they are known for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        default: { $ref: "#/components/responses/Error" }
  /posters/users/me/photo.jpg:
    get:
      operationId: getMyPicture
      description: The user's own picture in Settings, Account and the account menu. Needs a credential, a device key or a bearer token; the picture is the caller's. 404 not_found when none is set.
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /posters/{kind}/{id}/{file}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [movies, series, people] }
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: file
        in: path
        required: true
        description: poster.jpg or backdrop.jpg for a title, photo.jpg for a person.
        schema: { type: string }
    get:
      operationId: getArtwork
      security: []
      description: Posters, backdrops and headshots on every screen that draws a title or a person. Needs no credential, as an image element cannot send one.
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /watchstate:
    get:
      operationId: listWatchState
      description: Home's Continue Watching row, and every watched or progress mark in the library.
      responses:
        "200":
          description: Watch state, most recently updated first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Watch" }
        default: { $ref: "#/components/responses/Error" }
  /watchstate/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    put:
      operationId: setWatched
      description: |
        The Mark watched and Mark unwatched actions on Detail, and the sync of what a desktop app watched from a download while the server was out of reach.
        The second body carries a position and the time it was recorded; the server applies it only when `at` is later than the state's `updated_at`,
        works out `watched` as a heartbeat does, and answers with the state it now holds, whether or not it applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [watched]
                  properties:
                    watched: { type: boolean }
                - type: object
                  required: [position_seconds, duration_seconds, at]
                  properties:
                    position_seconds: { type: integer, minimum: 0 }
                    duration_seconds: { type: integer, minimum: 0 }
                    at: { type: string, description: ISO 8601 }
      responses:
        "200":
          description: The state after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watch" }
        "400":
          description: A body that is neither shape, or an `at` that is not a time. `error.code` is `invalid_request`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getMe
      description: Settings, Account (read-only; the name and the email are edited in Streamline), and the library language the screens read.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
  /me/picture:
    put:
      operationId: setPicture
      description: Settings, Account. Replaces the profile picture with the request body.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "204": { description: The picture is saved. }
        "413":
          description: "The picture is over 512 KB. `error.code` is `too_large`. Streamline core caps every request body at 1 MiB and answers a bigger one itself, as `413` with a flat body of `message` and `code` (`body_too_large`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Not a JPEG, PNG or WebP image. `error.code` is `unsupported_type`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removePicture
      description: Settings, Account. Removes the profile picture, back to the initials.
      responses:
        "204": { description: The picture is removed. }
        default: { $ref: "#/components/responses/Error" }
  /activity:
    get:
      operationId: listActivity
      description: Activity. What happened on the server, newest first, at most 100 events, with the caller's read state. A `download` event is returned only to the device that made it.
      responses:
        "200":
          description: The feed. Empty for a library with nothing in it.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/ActivityEvent" }
        default: { $ref: "#/components/responses/Error" }
  /activity/read:
    post:
      operationId: markActivityRead
      description: Activity. Marks events read for the calling user. Unknown IDs are ignored. `error.code` is `invalid_request` for a missing or empty list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        "204": { description: The events are read. }
        "400":
          description: No IDs, or more than 100.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /devices:
    get:
      operationId: listDevices
      description: Settings, Devices.
      responses:
        "200":
          description: The user's paired devices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Error" }
  /devices/current:
    delete:
      operationId: signOutDevice
      description: Settings, Sign out. Revokes the calling device's key.
      responses:
        "204": { description: The key is revoked. }
        default: { $ref: "#/components/responses/Error" }
  /devices/{deviceId}:
    delete:
      operationId: revokeDevice
      description: Settings, Devices. Signs out any device of the user, a browser or an app.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204": { description: The device is revoked. }
        default: { $ref: "#/components/responses/Error" }
  /downloads:
    post:
      operationId: createDownload
      description: |
        Downloads. Asks the server to prepare a file for this device: `original` is the file as it is (or a copy of the chosen audio tracks), `1080p` and `720p` a capped MP4.
        Only an app's device key may call it; a browser's bearer token gets 403 `forbidden`. Asking again for the same media, quality and audio tracks answers the same job.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id, quality, audio_indexes, capabilities]
              properties:
                media_id: { type: string }
                quality: { $ref: "#/components/schemas/DownloadQuality" }
                audio_indexes:
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 0 }
                  description: Stream indexes as the media's tracks number them.
                capabilities: { $ref: "#/components/schemas/Capabilities" }
      responses:
        "201":
          description: The job to poll.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadJob" }
        "400":
          description: A missing field, no audio track, or an index the file lacks. `error.code` is `invalid_request`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not an app's device key. `error.code` is `forbidden`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such media. `error.code` is `not_found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The engine's queue is full. `error.code` is `queue_full`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /downloads/{downloadId}:
    parameters:
      - $ref: "#/components/parameters/DownloadId"
    get:
      operationId: getDownload
      description: |
        Downloads. The job's state. Once `ready`, `url` is the engine's signed `/dl` address, minted again on every call and good for 12 hours.
        A download belongs to the device that made it: another device, and an unknown ID, get 404 `not_found`; a browser's bearer token gets 403 `forbidden`.
      security:
        - deviceKey: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadJob" }
        "403":
          description: Not an app's device key. `error.code` is `forbidden`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not this device's download. `error.code` is `not_found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDownload
      description: Downloads. Cancels the job and deletes it on the engine. An unknown or already deleted ID answers 204 as well.
      security:
        - deviceKey: []
      responses:
        "204": { description: The job is gone. }
        "403":
          description: Not an app's device key. `error.code` is `forbidden`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /downloads/{downloadId}/complete:
    post:
      operationId: completeDownload
      description: |
        Downloads. The app has the whole file. Streamline deletes the engine's job and records a `download` event in Activity for this device, unread.
      security:
        - deviceKey: []
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "204": { description: The event is recorded and the job deleted. }
        "403":
          description: Not an app's device key. `error.code` is `forbidden`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not this device's download. `error.code` is `not_found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The job is not `ready`. `error.code` is `not_ready`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/overview:
    get:
      operationId: adminOverview
      description: Server settings, Overview. Admin only; anyone else gets 403 `forbidden`. Sizes are bytes.
      responses:
        "200":
          description: What the server runs, where it keeps its data, and its health.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        default: { $ref: "#/components/responses/Error" }
  /admin/settings:
    get:
      operationId: adminSettings
      description: Server settings. The ten keys, who owns each, and which ones wait for a restart. Admin only.
      responses:
        "200":
          description: The settings as the server holds them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: adminSaveSettings
      description: Server settings. Saves the given keys, all or nothing. The extension forwards the engine-owned ones to the engine. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { $ref: "#/components/schemas/SettingValue" }
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "400":
          description: An unknown key or a value it does not take. `error.code` is `invalid_setting`, `error.key` names the key. Nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The owner's config is read-only. `error.code` is `read_only`, `error.owner` is `engine`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/restart:
    post:
      operationId: adminRestart
      description: "Server settings, Restart. Restarts the engine; streams stop for about ten seconds. The message reaches the players as `server_restarting`, with `by` and `retry_after: 10`. Admin only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 200 }
      responses:
        "202": { description: The restart is under way. }
        default: { $ref: "#/components/responses/Error" }
  /admin/streams:
    get:
      operationId: adminStreams
      description: Server settings, Now playing. Every stream running now. Admin only.
      responses:
        "200":
          description: The streams, in no particular order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminStream" }
        default: { $ref: "#/components/responses/Error" }
  /admin/streams/{streamId}/stop:
    post:
      operationId: adminStopStream
      description: Server settings, Now playing. Stops one stream; the player is told on its next heartbeat, with the message and the admin's name. Admin only.
      parameters:
        - name: streamId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 200 }
      responses:
        "204": { description: The stream is stopped. }
        "404":
          description: No such stream. `error.code` is `not_found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      operationId: adminUsers
      description: Server settings, Devices. The people a pairing can be approved for, the unlocked users ordered by name. Admin only.
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        default: { $ref: "#/components/responses/Error" }
  /admin/engine/secret:
    get:
      operationId: adminEngineSecret
      description: Server settings, Engine. Whether the secret shared with the engine is set. The secret itself is never read back. Admin only.
      responses:
        "200":
          description: The secret's status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineSecretStatus" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: adminRotateEngineSecret
      description: Server settings, Engine. Generates the engine secret and answers it, this once. It replaces any older one, so playback stops until the engine's config is updated. Admin only.
      responses:
        "200":
          description: The new secret.
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /admin/pairings:
    get:
      operationId: adminPairings
      description: Server settings, Devices. Pairing requests waiting for approval. Admin only.
      responses:
        "200":
          description: The pending requests.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminPairing" }
        default: { $ref: "#/components/responses/Error" }
  /admin/pairings/{userCode}/approve:
    post:
      operationId: adminApprovePairing
      description: Server settings, Devices. An admin approves a pairing from Server settings for the user they pick, with a device key or a bearer token; the device's next poll gets a key of that user's. 404 no_pending_pairing for an unknown, used or expired code, 404 not_found for an unknown or locked user. Admin only.
      parameters:
        - { $ref: "#/components/parameters/UserCode" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, description: An `id` of `/admin/users`. }
      responses:
        "204": { description: Approved. }
        "400":
          description: No `user_id`. `error.code` is `invalid_request`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No pending pairing (`no_pending_pairing`) or no such user (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/pairings/{userCode}/deny:
    post:
      operationId: adminDenyPairing
      description: Server settings, Devices. An admin denies a pairing; the device's next poll gets access_denied. Same errors as approve. Admin only.
      parameters:
        - { $ref: "#/components/parameters/UserCode" }
      responses:
        "204": { description: Denied. }
        default: { $ref: "#/components/responses/Error" }
  /admin/devices:
    get:
      operationId: adminDevices
      description: Server settings, Devices. Every paired app and browser session of every user, the caller's own first. Admin only.
      responses:
        "200":
          description: The devices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminDevice" }
        default: { $ref: "#/components/responses/Error" }
  /admin/devices/{deviceId}:
    delete:
      operationId: adminRevokeDevice
      description: Server settings, Devices. Revokes any user's device or browser session. Admin only.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204": { description: The device is revoked. }
        "404":
          description: No such device. `error.code` is `not_found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The caller's own device. `error.code` is `current_device`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/library:
    get:
      operationId: adminLibrary
      description: Server settings, Library. The folders and the scan running on each. Admin only.
      responses:
        "200":
          description: The folders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLibrary" }
        default: { $ref: "#/components/responses/Error" }
  /admin/library/scan:
    post:
      operationId: adminScan
      description: Server settings, Library, and the Scan buttons of a title and a season. Starts a scan of one folder, of the given movies and episodes, or of all without any; `movies` and `episodes` win over `folder_id`. A folder already scanning is left alone. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_id: { type: string }
                movies: { type: array, items: { type: integer } }
                episodes: { type: array, items: { type: integer } }
      responses:
        "202": { description: The scan runs; its progress is in `/admin/library`. }
        "404":
          description: No such folder. `error.code` is `not_found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/cache/clear:
    post:
      operationId: adminClearCache
      description: Server settings, Transcoding. Empties the conversion cache. Admin only.
      responses:
        "200":
          description: What was freed.
          content:
            application/json:
              schema:
                type: object
                required: [freed]
                properties:
                  freed: { type: integer, description: Bytes. }
        default: { $ref: "#/components/responses/Error" }
  /auth/methods:
    get:
      operationId: authMethods
      description: Sign-in. What the sign-in card shows besides its one button; Streamline's own page offers single sign-on or email.
      security: []
      responses:
        "200":
          description: The card's extras.
          content:
            application/json:
              schema:
                type: object
                required: [register_url]
                properties:
                  register_url: { type: string, nullable: true }
        default: { $ref: "#/components/responses/Error" }
  /authorize:
    get:
      operationId: authorize
      description: Sign-in, on the extension's session mount, so Streamline's own login runs first. The web player, or an app through the system browser, is sent here (PKCE); it comes back to redirect_uri with a code, or with error=access_denied. redirect_uri is a web player origin on the allow-list or, for an app, a loopback http://127.0.0.1 address on any port (RFC 8252) or the app's own link.
      security: []
      parameters:
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        "302":
          description: Back to redirect_uri.
          headers:
            Location: { schema: { type: string } }
        default: { $ref: "#/components/responses/Error" }
  /auth/token:
    post:
      operationId: token
      description: Sign-in. A browser exchanges a code or a refresh token for its tokens; every refresh rotates the refresh token. A rotated one is taken once more within 30 seconds, for a browser that never received the answer, and the tokens of the first answer are then withdrawn; replaying it later, or using withdrawn tokens, revokes the browser. An app exchanges a code with its client_id for a device key, shown once; a known client_id loses its old key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [grant_type, code, code_verifier, redirect_uri, device_name]
                  properties:
                    grant_type: { type: string, enum: [authorization_code] }
                    code: { type: string }
                    code_verifier: { type: string }
                    redirect_uri: { type: string }
                    device_name: { type: string }
                - type: object
                  required: [grant_type, code, code_verifier, redirect_uri, client_id, name, platform]
                  properties:
                    grant_type: { type: string, enum: [authorization_code] }
                    code: { type: string }
                    code_verifier: { type: string }
                    redirect_uri: { type: string }
                    client_id: { type: string }
                    name: { type: string }
                    platform: { type: string }
                - type: object
                  required: [grant_type, refresh_token]
                  properties:
                    grant_type: { type: string, enum: [refresh_token] }
                    refresh_token: { type: string }
      responses:
        "200":
          description: A browser's tokens, or an app's device key.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Tokens"
                  - type: object
                    required: [api_key, key_id]
                    properties:
                      api_key: { type: string }
                      key_id: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /auth/device/code:
    post:
      operationId: startPairing
      description: Welcome, Pair. Starts a device pairing and returns the code the screen shows.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, name, platform]
              properties:
                client_id: { type: string }
                name: { type: string }
                platform: { type: string }
      responses:
        "200":
          description: The pairing.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                properties:
                  device_code: { type: string }
                  user_code: { type: string }
                  verification_uri: { type: string }
                  verification_uri_complete: { type: string, description: "The approval page with the code filled in; the QR code and the pairing link carry it." }
                  expires_in: { type: integer }
                  interval: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /auth/device/token:
    post:
      operationId: pollPairing
      description: Welcome, Pair. One poll of a pairing; the 400 codes are authorization_pending, slow_down, access_denied and expired_token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code: { type: string }
      responses:
        "200":
          description: The pairing was approved; the key is shown to the app once.
          content:
            application/json:
              schema:
                type: object
                required: [api_key, key_id]
                properties:
                  api_key: { type: string }
                  key_id: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /auth/device/{userCode}:
    get:
      operationId: getPairRequest
      description: Approval page. What a pairing asks for, so the page shows what it approves. Ours, not in Streamline's pairing spec. A browser's bearer token only.
      security:
        - bearer: []
      parameters:
        - { $ref: "#/components/parameters/UserCode" }
      responses:
        "200":
          description: The pending pairing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairRequest" }
        default: { $ref: "#/components/responses/Error" }
  /auth/device/{userCode}/approve:
    post:
      operationId: approvePairing
      description: Approval page. Approves a pairing; the device's next poll gets its key. 404 no_pending_pairing for an unknown, used or expired code, 403 session_required for a device key. A browser's bearer token only.
      security:
        - bearer: []
      parameters:
        - { $ref: "#/components/parameters/UserCode" }
      responses:
        "204": { description: Approved. }
        default: { $ref: "#/components/responses/Error" }
  /auth/device/{userCode}/deny:
    post:
      operationId: denyPairing
      description: Approval page. Denies a pairing; the device's next poll gets access_denied. Same errors as approve. A browser's bearer token only.
      security:
        - bearer: []
      parameters:
        - { $ref: "#/components/parameters/UserCode" }
      responses:
        "204": { description: Denied. }
        default: { $ref: "#/components/responses/Error" }
  /playback/status:
    get:
      operationId: playbackStatus
      description: The player's start-up check and where Streamline places this device (home or away).
      responses:
        "200":
          description: Whether playback is available.
          content:
            application/json:
              schema:
                type: object
                required: [available, network]
                properties:
                  available: { type: boolean }
                  media:
                    type: array
                    items: { type: string }
                  network: { type: string, enum: [home, away] }
        default: { $ref: "#/components/responses/Error" }
  /playback/decisions:
    post:
      operationId: decide
      description: The Player's quality menu, one decision per option, before any session exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id, capabilities, options]
              properties:
                media_id: { type: string }
                capabilities: { $ref: "#/components/schemas/Capabilities" }
                options:
                  type: array
                  items: { $ref: "#/components/schemas/SessionOptions" }
      responses:
        "200":
          description: One decision per option, in order.
          content:
            application/json:
              schema:
                type: object
                required: [bit_rate, decisions]
                properties:
                  bit_rate: { type: integer }
                  decisions:
                    type: array
                    items:
                      anyOf:
                        - $ref: "#/components/schemas/Plan"
                        - type: object
                          required: [error]
                          properties:
                            error: { $ref: "#/components/schemas/ErrorBody" }
        default: { $ref: "#/components/responses/Error" }
  /playback/sessions:
    post:
      operationId: startSession
      description: The Player, on opening a title or resuming after a halt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [media_id, capabilities, position]
                  properties:
                    media_id: { type: string }
                    capabilities: { $ref: "#/components/schemas/Capabilities" }
                    position: { type: number }
                - $ref: "#/components/schemas/SessionOptions"
      responses:
        "200":
          description: The session and the HLS url the webview plays.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }
  /playback/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      description: The Player's stats overlay.
      responses:
        "200":
          description: What the engine reports for the session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: patchSession
      description: The Player's audio, subtitle-burn-in and quality menus, and seeking past what the engine has built.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SessionOptions"
                - type: object
                  properties:
                    position: { type: number }
      responses:
        "200":
          description: The session as changed, with a fresh url.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: stopSession
      description: The Player, on leaving.
      responses:
        "200":
          description: Stopped; the engine's reply is passed through.
          content:
            application/json:
              schema: { nullable: true }
        "204": { description: Stopped. }
        default: { $ref: "#/components/responses/Error" }
  /playback/sessions/{sessionId}/progress:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: heartbeat
      description: The Player's heartbeat, which also writes the watch position. A 410 means an admin stopped the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, paused]
              properties:
                position: { type: number }
                paused: { type: boolean }
      responses:
        "204": { description: Recorded. }
        default: { $ref: "#/components/responses/Error" }
  /playback/media/{mediaId}/tracks:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: getTracks
      description: The Player's audio and subtitle menus, chapters, and the intro and credits cards.
      responses:
        "200":
          description: What the file holds, and the engine URLs of its subtitles, fonts and trickplay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tracks" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    deviceKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearer:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    DownloadId:
      name: downloadId
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string }
    UserCode:
      name: userCode
      in: path
      required: true
      description: The pairing code, with or without its dash, in either case.
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }

  responses:
    Error:
      description: Any failure. `code` is what the client branches on.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ErrorBody:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string }
        key: { type: string, description: "`invalid_setting`: the key refused." }
        owner: { type: string, enum: [engine, player], description: "`read_only`: whose config is locked." }
        by: { type: string, description: "`session_stopped`, `server_restarting`: the admin who did it." }
        retry_after: { type: integer, description: "`server_restarting`: seconds before the player retries." }
        need: { type: string, description: "`transcode_limit`: why this stream needs a conversion slot, as the decision words it." }
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }

    PairRequest:
      type: object
      required: [user_code, name, platform, requested_at, ip]
      properties:
        user_code: { type: string }
        name: { type: string }
        platform: { type: string }
        requested_at: { type: string, description: ISO 8601 }
        ip: { type: string }

    FileSummary:
      type: object
      properties:
        file_count: { type: integer }
        resolution: { type: string }
        codec: { type: string }
        hdr: { type: string }
        audio: { type: string }
        channels: { type: string }
        size:
          type: integer
          description: Bytes on disk, the sum of the episode files for a show. Library sorts by it and Detail's technical details show it.
    CastMember:
      type: object
      required: [id, name, character]
      properties:
        id: { type: string }
        name: { type: string }
        character: { type: string }
        seasons:
          type: array
          items: { type: integer }
    Episode:
      type: object
      required: [id, number, title, overview, runtime, has_file, media_file_id]
      properties:
        id: { type: integer }
        number: { type: integer }
        title: { type: string }
        overview: { type: string }
        runtime: { type: integer }
        has_file: { type: boolean }
        media_file_id: { type: string }
        air_date: { type: string }
        status: { type: string }
    Season:
      type: object
      required: [number, name, episodes]
      properties:
        number: { type: integer }
        name: { type: string }
        total: { type: integer }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/Episode" }
    Title:
      type: object
      required: [id, title, year, overview, genres, rating, added_at]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        original_title: { type: string }
        year: { type: integer }
        overview: { type: string }
        genres:
          type: array
          items: { type: string }
        rating: { type: number }
        added_at: { type: string }
        status: { type: string }
        monitored: { type: boolean }
        tmdb_id: { type: integer }
        file_summary: { $ref: "#/components/schemas/FileSummary" }
        runtime: { type: integer }
        certification: { type: string }
        media_files:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
        network: { type: string }
        total_seasons: { type: integer }
        episodes:
          description: >-
            In the series list only: the signed-in user's episodes with a file,
            how many are watched, and how many are watched or under way.
          type: object
          required: [total, watched, started]
          properties:
            total: { type: integer }
            watched: { type: integer }
            started: { type: integer }
        first_aired: { type: string }
        seasons:
          type: array
          items: { $ref: "#/components/schemas/Season" }
        cast:
          type: array
          items: { $ref: "#/components/schemas/CastMember" }
    TitleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Title" }
        total: { type: integer }
    Credit:
      type: object
      required: [kind, id, title, year, character]
      properties:
        kind: { type: string, enum: [movies, series] }
        id: { type: integer }
        title: { type: string }
        year: { type: integer }
        character: { type: string }
        seasons:
          type: array
          items: { type: integer }
        total_seasons: { type: integer, nullable: true }
    Person:
      type: object
      required: [id, name, department, credits, known_for]
      properties:
        id: { type: string }
        name: { type: string }
        department: { type: string }
        credits:
          type: array
          items: { $ref: "#/components/schemas/Credit" }
        known_for:
          type: array
          items:
            type: object
            required: [title, year]
            properties:
              title: { type: string }
              year: { type: integer }
              kind: { type: string, enum: [movies, series] }
              id: { type: integer }
    Watch:
      type: object
      required: [media_id, position_seconds, duration_seconds, watched]
      properties:
        media_id: { type: string }
        movie_id: { type: integer }
        series_id: { type: integer }
        season: { type: integer }
        episode_id: { type: integer }
        position_seconds: { type: number }
        duration_seconds: { type: number }
        watched: { type: boolean }
        updated_at: { type: string }
    Me:
      type: object
      required: [id, name, email, role, streamline_url, player_url]
      properties:
        id: { type: integer, description: The account's id in Streamline; the same as an `AdminUser.id`. }
        name: { type: string, description: "The display name; the email's local part for an account that has none." }
        email: { type: string }
        role: { type: string, description: "`Admin` or `Member`." }
        streamline_url: { type: string, description: "Where the Streamline the extension runs in is reached, as the call came to it; its account page is at {streamline_url}/account." }
        player_url: { type: string, nullable: true, description: "The web player's address (the player.url setting), where an app sends a person to approve a TV at {player_url}/pair; null until an admin sets it." }
        library_language: { type: string, description: "BCP 47 tag of the language titles and synopses are shown in, kept per account by the extension (default en)." }
        picture: { type: boolean, description: Whether a profile picture is set. }
        initials: { type: string, description: One or two capital letters of the name, drawn when there is no picture. }
    Kind:
      type: string
      enum: [movies, series]
    Featured:
      type: object
      required: [kind, id, reason]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        id: { type: integer }
        reason:
          type: string
          enum: [continue, next, new_episodes, added]
          description: The billboard's eyebrow, Continue watching, Up next (the episode after a finished one), New episodes, or Added today.
        season: { type: integer }
        episodes: { type: array, items: { type: integer } }
    Arrival:
      type: object
      required: [kind, id, at]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        id: { type: integer }
        at: { type: string, description: ISO 8601 }
        season: { type: integer, description: Set when episodes arrived, absent when the whole title did. }
        episodes: { type: array, items: { type: integer } }
    ArrivalDay:
      type: object
      required: [date, items]
      properties:
        date: { type: string, description: YYYY-MM-DD }
        items:
          type: array
          items: { $ref: "#/components/schemas/Arrival" }
    HomeFeed:
      type: object
      required: [featured, arrivals]
      properties:
        featured:
          type: array
          items: { $ref: "#/components/schemas/Featured" }
        arrivals:
          type: array
          description: Newest day first.
          items: { $ref: "#/components/schemas/ArrivalDay" }
    Tokens:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in, device_id]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string }
        refresh_expires_in: { type: integer }
        device_id: { type: string }
    ActivityEvent:
      type: object
      description: A fact, not a sentence; the client writes the wording. Which fields come with a kind is listed on each.
      required: [id, kind, at, read]
      properties:
        id: { type: string }
        kind: { type: string, enum: [episodes, season, movie, upgrade, download, device, server, scan] }
        at: { type: string, description: ISO 8601, UTC }
        read: { type: boolean }
        title:
          type: object
          description: episodes, season, movie, upgrade, download.
          required: [kind, id]
          properties:
            kind: { type: string, enum: [movies, series] }
            id: { type: integer }
        season: { type: integer, description: "episodes, season, a download of an episode." }
        episodes: { type: array, items: { type: integer }, description: "episodes: the numbers added. download: the one episode." }
        episode_count: { type: integer, description: season. }
        file: { $ref: "#/components/schemas/FileSummary", description: "movie, upgrade: the file now in the library." }
        previous: { $ref: "#/components/schemas/FileSummary", description: "upgrade: the file it replaced." }
        device:
          type: object
          description: "device, and download: the device that made it."
          required: [name, platform]
          properties:
            name: { type: string }
            platform: { type: string }
            location: { type: string }
        server:
          type: object
          required: [version]
          properties:
            version: { type: string }
            restart_seconds: { type: integer }
        scan:
          type: object
          required: [added, upgraded, errors]
          properties:
            added: { type: integer }
            upgraded: { type: integer }
            errors: { type: integer }
    Device:
      type: object
      required: [id, kind, name, platform, last_seen, streaming, current]
      properties:
        id: { type: string }
        kind: { type: string, enum: [app, browser] }
        expires_at: { type: string }
        name: { type: string }
        platform: { type: string }
        last_seen: { type: string }
        streaming: { type: boolean }
        current: { type: boolean }

    SettingValue:
      description: A setting's value; its type is the key's.
      oneOf:
        - { type: string }
        - { type: number }
        - { type: boolean }
        - { type: array, items: { type: string } }
    AdminSettings:
      type: object
      required: [values, owners, read_only, pending, restart_keys]
      properties:
        values:
          type: object
          description: "The engine's keys transcoding.hw_accel, transcoding.hw_device, stream.tonemap and stream.max_live (absent while the engine cannot be reached), and the player's engine.url, engine.public_url, player.url (strings), player.origins, player.app_links and network.home (string arrays)."
          additionalProperties: { $ref: "#/components/schemas/SettingValue" }
        owners:
          type: object
          description: The engine owns transcoding.hw_accel, transcoding.hw_device, stream.tonemap and stream.max_live; the player extension owns the rest.
          additionalProperties: { type: string, enum: [engine, player] }
        read_only:
          type: object
          description: An owner whose config is read-only refuses every change to its keys. The player's is never.
          required: [engine, player]
          properties:
            engine: { type: boolean }
            player: { type: boolean }
        pending: { type: array, items: { type: string }, description: Keys saved but only applied after a restart. }
        restart_keys: { type: array, items: { type: string }, description: Every key that waits for a restart. }
    AdminOverview:
      type: object
      description: "The fields of an engine that does not answer are absent, bar `engine.reachable: false`."
      required: [extension, engine, storage, folders, streamline_url]
      properties:
        extension:
          type: object
          required: [version]
          properties:
            version: { type: string }
        engine:
          type: object
          required: [reachable]
          properties:
            reachable: { type: boolean }
            version: { type: string }
            api_version: { type: integer }
            ffmpeg_version: { type: string }
            analysis_version: { type: integer }
            hw:
              type: object
              required: [mode, ready]
              properties:
                mode: { type: string, enum: [vaapi, software] }
                ready: { type: boolean }
            libplacebo: { type: boolean }
            dovi_tool: { type: boolean }
        storage:
          type: object
          properties:
            cache:
              type: object
              description: Absent while the engine does not answer.
              required: [size, streams]
              properties:
                size: { type: integer }
                streams: { type: integer, description: Streams the cache holds segments for. }
        folders:
          type: object
          required: [reachable, total]
          properties:
            reachable: { type: integer }
            total: { type: integer }
        streamline_url: { type: string }
    AdminStream:
      type: object
      description: A fact, not a sentence. `video` and `audio` describe a stream sent as it is; `from` and `to` one that is converted.
      required: [id, user, title, device, network, position, duration, playing, mode, bitrate]
      properties:
        id: { type: string }
        user:
          type: object
          required: [name, you]
          properties:
            name: { type: string }
            you: { type: boolean }
        title:
          type: object
          required: [kind, id]
          properties:
            kind: { $ref: "#/components/schemas/Kind" }
            id: { type: integer }
        season: { type: integer }
        episode: { type: integer }
        device:
          type: object
          required: [name, kind]
          properties:
            name: { type: string }
            kind: { type: string, enum: [browser, tablet, phone, tv, desktop] }
        network: { type: string, enum: [home, remote] }
        position: { type: number, description: Seconds. }
        duration: { type: number, description: Seconds. }
        playing: { type: boolean }
        mode: { type: string, enum: [copy, audio, transcode] }
        video: { type: string }
        audio: { type: string }
        from: { type: string }
        to: { type: string }
        hw: { type: string }
        speed: { type: number, description: Times realtime. }
        cannot_decode: { type: string, description: The codec the device cannot decode, which is why the stream is converted. }
        bitrate: { type: integer, description: Bits per second. }
    AdminUser:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string, description: "The display name; the email's local part for an account that has none." }
        role: { type: string, description: "`Admin` or `Member`." }
    EngineSecretStatus:
      type: object
      required: [set]
      properties:
        set: { type: boolean }
        created_at: { type: string, description: When it was generated; absent while unset. }
    AdminPairing:
      type: object
      required: [user_code, name, platform, created_at, expires_at]
      properties:
        user_code: { type: string }
        name: { type: string }
        platform: { type: string }
        created_at: { type: string }
        expires_at: { type: string }
    AdminDevice:
      type: object
      description: The `Device` shape, with the owner and where its key is kept.
      required: [id, kind, name, platform, last_seen, streaming, current, user]
      properties:
        id: { type: string }
        kind: { type: string, enum: [app, browser] }
        name: { type: string }
        platform: { type: string }
        last_seen: { type: string }
        streaming: { type: boolean }
        current: { type: boolean }
        user:
          type: object
          required: [name]
          properties:
            name: { type: string }
        key_store: { type: string, description: Apps. }
        location: { type: string }
        expires_at: { type: string, description: Browsers. }
    AdminLibrary:
      type: object
      required: [folders]
      properties:
        folders:
          type: array
          items:
            type: object
            required: [id, name, path, kind, count, size]
            properties:
              id: { type: string }
              name: { type: string }
              path: { type: string }
              kind: { $ref: "#/components/schemas/Kind" }
              count: { type: integer }
              size: { type: integer, description: Bytes. }
              scan:
                type: object
                description: Present while the folder is scanning.
                required: [progress, eta_seconds]
                properties:
                  progress: { type: number, minimum: 0, maximum: 1 }
                  eta_seconds: { type: integer }
        last_scan:
          type: object
          required: [at, added, replaced, errors]
          properties:
            at: { type: string }
            added: { type: integer }
            replaced: { type: integer }
            errors: { type: integer }

    DownloadQuality:
      type: string
      enum: [original, 1080p, 720p]
    DownloadJob:
      type: object
      required: [id, media_id, state, progress, size, container, url]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        media_id: { type: string }
        state: { type: string, enum: [preparing, ready, failed] }
        progress: { type: number, minimum: 0, maximum: 1, description: 1 once ready. }
        size: { type: integer, nullable: true, description: Bytes, once ready. }
        container: { type: string, nullable: true, description: "mkv, mp4, avi, ... once ready." }
        url: { type: string, nullable: true, description: The engine's /dl URL with `exp` and `sig`, once ready. }
        error: { $ref: "#/components/schemas/ErrorBody", description: When failed. }

    Capabilities:
      type: object
      additionalProperties: false
      required: [video, hdr, audio, containers, subtitles, hls_keyframe_exact]
      properties:
        video:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [codec, profiles, max_level, max_width, max_height, max_fps]
            properties:
              codec: { type: string }
              profiles:
                type: array
                items: { type: string }
              max_level: { type: integer, nullable: true }
              max_width: { type: integer }
              max_height: { type: integer }
              max_fps: { type: number }
        hdr:
          type: object
          additionalProperties: false
          required: [formats, dv_profiles]
          properties:
            formats:
              type: array
              items: { type: string }
            dv_profiles:
              type: array
              items: { type: integer }
        audio:
          type: object
          additionalProperties: false
          required: [codecs, max_channels, passthrough]
          properties:
            codecs:
              type: array
              items: { type: string }
            max_channels: { type: integer }
            passthrough:
              type: array
              items: { type: string }
        containers:
          type: array
          items: { type: string }
        subtitles:
          type: array
          items: { type: string }
        hls_keyframe_exact: { type: boolean }
    SessionOptions:
      type: object
      description: Absent keeps the session's value, null clears it (default audio, no burn-in, original quality).
      properties:
        audio_index: { type: integer, nullable: true }
        burn_in_subtitle: { type: integer, nullable: true }
        max_bitrate: { type: integer, nullable: true }

    Reason:
      type: object
      required: [code, text]
      properties:
        code: { type: string }
        text: { type: string }
    VideoOut:
      type: object
      required: [action, codec, width, height, hdr]
      properties:
        action: { type: string }
        codec: { type: string }
        width: { type: integer }
        height: { type: integer }
        hdr: { type: string }
        dv_profile: { type: integer }
    AudioOut:
      type: object
      required: [action, codec, channels]
      properties:
        action: { type: string }
        codec: { type: string }
        channels: { type: integer }
    Mode:
      type: string
      enum: [direct, remux, audio_transcode, transcode]
    Plan:
      type: object
      required: [mode, video, audio, video_reasons, audio_reasons, hw, needs_slot, bandwidth]
      properties:
        mode: { $ref: "#/components/schemas/Mode" }
        video: { $ref: "#/components/schemas/VideoOut" }
        audio: { $ref: "#/components/schemas/AudioOut" }
        video_reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        audio_reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        hw: { type: string }
        needs_slot: { type: boolean }
        bandwidth: { type: integer }
    Session:
      type: object
      required: [session_id, mode, url, url_path, bandwidth, duration, video, audio, video_reasons, audio_reasons, hw]
      properties:
        session_id: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        url: { type: string }
        url_path: { type: string }
        bandwidth: { type: integer }
        duration: { type: number }
        video: { $ref: "#/components/schemas/VideoOut" }
        audio: { $ref: "#/components/schemas/AudioOut" }
        video_reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        audio_reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        hw: { type: string }
    SessionInfo:
      type: object
      required: [session_id, mode, hw, video, audio, speed, bitrate, last_fetch, bytes_served]
      properties:
        session_id: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        hw: { type: string }
        video: { $ref: "#/components/schemas/VideoOut" }
        audio: { $ref: "#/components/schemas/AudioOut" }
        speed: { type: number, nullable: true }
        bitrate: { type: integer, nullable: true }
        last_fetch: { type: integer, nullable: true }
        bytes_served: { type: integer }

    AudioTrack:
      type: object
      required: [index, codec, channels, language, default]
      properties:
        index: { type: integer }
        codec: { type: string }
        profile: { type: string }
        channels: { type: integer }
        layout: { type: string }
        language: { type: string }
        title: { type: string }
        default: { type: boolean }
        forced: { type: boolean }
    SubtitleTrack:
      type: object
      required: [index, codec, language, forced, sdh, files]
      properties:
        index: { type: integer }
        codec: { type: string }
        language: { type: string }
        title: { type: string }
        default: { type: boolean }
        forced: { type: boolean }
        sdh: { type: boolean }
        files:
          type: object
          description: Subtitle format to the absolute engine URL, carrying `exp` and `sig`; the client fetches it without a credential.
          additionalProperties: { type: string }
    Span:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: number }
      nullable: true
    Tracks:
      type: object
      required: [preparing, container, video, chapters, markers, audio, subtitles, fonts, trickplay]
      properties:
        preparing: { type: boolean }
        container: { type: string }
        video:
          type: object
          nullable: true
          required: [codec, width, height]
          properties:
            codec: { type: string }
            width: { type: integer }
            height: { type: integer }
            profile: { type: string }
            hdr: { type: string }
            dv: { type: object, nullable: true }
        chapters:
          type: array
          items:
            type: object
            required: [start, end, title]
            properties:
              start: { type: number }
              end: { type: number }
              title: { type: string }
        markers:
          type: object
          required: [intro, credits]
          properties:
            intro: { $ref: "#/components/schemas/Span" }
            credits: { $ref: "#/components/schemas/Span" }
        audio:
          type: array
          items: { $ref: "#/components/schemas/AudioTrack" }
        subtitles:
          type: array
          items: { $ref: "#/components/schemas/SubtitleTrack" }
        fonts:
          type: array
          description: Absolute engine URLs carrying `exp` and `sig`.
          items: { type: string }
        trickplay:
          type: object
          nullable: true
          description: Null until the sheets are built, or when the file has no video.
          required: [url]
          properties:
            url:
              type: string
              description: The signed engine URL of `trickplay.json`; a sheet's URL is this one with its last path segment replaced by the sheet's name.
