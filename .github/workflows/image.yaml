# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image

# The engine's and the web player's images. A push to main publishes `main` and
# `sha-<commit>` for each image whose inputs it changed; a tag engine-v1.2.3 or
# web-v1.2.3 publishes `1.2.3`, `1.2` and `latest` for its own image
# (.taskfiles/release.yaml cuts them).
on:
  push:
    branches: [main]
    tags: ["engine-v*.*.*", "web-v*.*.*"]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  # The images a push changed, as a JSON list of names. Each name is a
  # deploy/<name>.Dockerfile and a ghcr.io/streamline-hq/streamline-player/<name>.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ github.ref_type == 'tag' && format('["{0}"]', steps.tag.outputs.image) || steps.filter.outputs.changes }}
    steps:
      - name: The tag's image
        id: tag
        if: github.ref_type == 'tag'
        run: echo "image=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
      - name: Checkout
        if: github.ref_type != 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changed images
        id: filter
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Each list is what its Dockerfile copies.
          filters: |
            engine:
              - &workflow '.github/workflows/image.yaml'
              - 'deploy/engine.Dockerfile'
              - 'deploy/engine.Dockerfile.dockerignore'
              # src-tauri/ and plugins/ are copied only because cargo wants every
              # workspace member present; the engine is built from none of them.
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            web:
              - *workflow
              - 'deploy/web.Dockerfile'
              - 'deploy/web.Dockerfile.dockerignore'
              - 'src/**'
              - 'static/**'
              - 'messages/**'
              - 'project.inlang/settings.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig.json'

  publish:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      IMAGE_NAME: streamline-hq/streamline-player/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action's semver type reads the git tag, and engine-v1.2.3 is
      # not one: it gets the version without the line's prefix.
      - name: Version
        id: v
        if: github.ref_type == 'tag'
        run: echo "version=${GITHUB_REF_NAME#*-v}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # The labels come from the Dockerfile: metadata-action's would replace
      # each image's description with the repository's.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          push: true

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### The $IMAGE image" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Pushed:" >> "$GITHUB_STEP_SUMMARY"
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ The image was not published" >> "$GITHUB_STEP_SUMMARY"
          fi
